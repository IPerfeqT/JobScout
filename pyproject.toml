[project]
name = "jobtool"
version = "0.1.0"
description = "Multi-site job search with a CRM dashboard and tech-stack analytics"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobtool = "jobtool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobtool*", "extensions*"]

[tool.setuptools.package-data]
jobtool = ["skills.json", "presets.json", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
